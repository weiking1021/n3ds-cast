name: receiver page

# Publishes the receiver page (receiver/) to GitHub Pages whenever it changes. Independent of the 3DS build.
on:
  push:
    branches: [main]
    paths:
      - receiver/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: receiver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test # builds the page (npm run build) and runs the PC receiver tests against it
      - uses: actions/upload-pages-artifact@v3
        with:
          path: receiver/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
